<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .ttl{font-size:17px;font-weight:700;fill:#1f2328}
    .box{fill:#ffffff;stroke:#d0d7de;stroke-width:1.5}
    .good{fill:#dafbe1;stroke:#1a7f37;stroke-width:1.5}
    .bad{fill:#ffebe9;stroke:#cf222e;stroke-width:1.5}
    .mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px}
    .lbl{font-size:13px;fill:#1f2328}
    .muted{font-size:11.5px;fill:#656d76}
    .tagG{font-size:13px;font-weight:700;fill:#1a7f37}
    .tagB{font-size:13px;font-weight:700;fill:#cf222e}
  </style>
  <rect x="0" y="0" width="900" height="420" fill="#f6f8fa"/>
  <text x="24" y="34" class="ttl">The data path is already O(1) &#8212; only the control plane scans</text>

  <!-- TOP: hot path -->
  <rect x="24" y="56" width="852" height="150" rx="10" class="good" fill-opacity="0.25"/>
  <text x="44" y="82" class="tagG">DATA PATH &#8212; per inbound message &#8212; O(1)</text>

  <rect x="44" y="98" width="200" height="84" rx="8" class="box"/>
  <text x="60" y="122" class="mono" fill="#0550ae">delivery sub closure</text>
  <text x="60" y="142" class="muted">binds its own si</text>
  <text x="60" y="160" class="muted">stream.go:4161</text>

  <path d="M 250 140 H 340" stroke="#1a7f37" stroke-width="2" marker-end="url(#g)"/>
  <text x="295" y="132" text-anchor="middle" class="muted">si (bound)</text>

  <rect x="344" y="98" width="240" height="84" rx="8" class="box"/>
  <text x="360" y="122" class="mono" fill="#0550ae">queueInbound(.., si)</text>
  <text x="360" y="142" class="muted">tags msg with si, single mux queue</text>
  <text x="360" y="160" class="muted">processAllSourceMsgs &#183; 4187</text>

  <path d="M 590 140 H 660" stroke="#1a7f37" stroke-width="2" marker-end="url(#g)"/>

  <rect x="664" y="98" width="190" height="84" rx="8" class="good"/>
  <text x="680" y="122" class="mono" fill="#0a3069">processInbound</text>
  <text x="680" y="140" class="mono" fill="#0a3069">SourceMsg(si)</text>
  <text x="680" y="166" class="tagG">no lookup &#183; O(1)</text>

  <!-- BOTTOM: control plane -->
  <rect x="24" y="226" width="852" height="166" rx="10" class="bad" fill-opacity="0.18"/>
  <text x="44" y="252" class="tagB">CONTROL PLANE &#8212; setup / election / update / INFO &#8212; scans cfg.Sources</text>

  <g>
    <rect x="44" y="268" width="250" height="44" rx="7" class="box"/>
    <text x="60" y="295" class="mono" fill="#0550ae">setupSourceConsumers  O(S&#178;)</text>
    <rect x="44" y="320" width="250" height="44" rx="7" class="box"/>
    <text x="60" y="347" class="mono" fill="#0550ae">STREAM.INFO &#8594; sourceInfo  O(S&#178;)</text>
  </g>
  <g>
    <rect x="310" y="268" width="270" height="44" rx="7" class="box"/>
    <text x="326" y="295" class="mono" fill="#0550ae">STREAM.UPDATE (sources)  O(S&#178;)</text>
    <rect x="310" y="320" width="270" height="44" rx="7" class="box"/>
    <text x="326" y="347" class="mono" fill="#0550ae">startingSequenceForSources  O(M&#183;S)</text>
  </g>

  <rect x="596" y="278" width="258" height="76" rx="8" class="bad"/>
  <text x="725" y="306" text-anchor="middle" class="tagB" font-size="15">all route through</text>
  <text x="725" y="330" text-anchor="middle" class="mono" font-size="13" fill="#0a3069">streamSource() &#8212; O(S) walk</text>

  <defs>
    <marker id="g" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#1a7f37"/></marker>
  </defs>
</svg>
