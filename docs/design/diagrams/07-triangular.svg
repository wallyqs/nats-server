<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .ttl{font-size:17px;font-weight:700;fill:#1f2328}
    .muted{font-size:12px;fill:#656d76}
    .mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px}
    .lbl{font-size:12.5px;fill:#1f2328}
    .scan{fill:#ffd1cc;stroke:#cf222e;stroke-width:1}
    .hit{fill:#cf222e}
    .empty{fill:#ffffff;stroke:#e1e4e8;stroke-width:1}
    .bad{font-size:14px;font-weight:700;fill:#cf222e}
  </style>
  <rect x="0" y="0" width="900" height="420" fill="#f6f8fa"/>
  <text x="24" y="32" class="ttl">Why setup is O(S&#178;): each of S setups re-scans the slice (example S = 5)</text>
  <text x="24" y="54" class="muted">Rows = setupSourceConsumers iterating sources in order &#183; Columns = streamSource() walking cfg.Sources to find that iname</text>

  <!-- grid origin -->
  <!-- column headers -->
  <g class="mono" fill="#656d76" text-anchor="middle">
    <text x="360" y="92">cmp[0]</text>
    <text x="430" y="92">cmp[1]</text>
    <text x="500" y="92">cmp[2]</text>
    <text x="570" y="92">cmp[3]</text>
    <text x="640" y="92">cmp[4]</text>
  </g>

  <!-- rows -->
  <!-- row i: setup of source i scans cells j=0..i (i+1 cells), diagonal = match -->
  <!-- y rows at 110,160,210,260,310 -->
  <g class="mono" fill="#1f2328" text-anchor="end">
    <text x="320" y="128">setup E1</text>
    <text x="320" y="178">setup E2</text>
    <text x="320" y="228">setup E3</text>
    <text x="320" y="278">setup E4</text>
    <text x="320" y="328">setup E5</text>
  </g>

  <!-- helper: cells. x = 330 + col*70 ; w 60 ; y = 110 + row*50 ; h 36 -->
  <!-- We'll draw scanned cells (col<=row) as .scan, with diagonal (col==row) marked as hit. Others empty. -->
  <!-- Row 0 -->
  <rect x="330" y="110" width="60" height="36" rx="5" class="scan"/><circle cx="360" cy="128" r="6" class="hit"/>
  <rect x="400" y="110" width="60" height="36" rx="5" class="empty"/>
  <rect x="470" y="110" width="60" height="36" rx="5" class="empty"/>
  <rect x="540" y="110" width="60" height="36" rx="5" class="empty"/>
  <rect x="610" y="110" width="60" height="36" rx="5" class="empty"/>
  <text x="700" y="132" class="mono" fill="#cf222e">1 compare</text>

  <!-- Row 1 -->
  <rect x="330" y="160" width="60" height="36" rx="5" class="scan"/>
  <rect x="400" y="160" width="60" height="36" rx="5" class="scan"/><circle cx="430" cy="178" r="6" class="hit"/>
  <rect x="470" y="160" width="60" height="36" rx="5" class="empty"/>
  <rect x="540" y="160" width="60" height="36" rx="5" class="empty"/>
  <rect x="610" y="160" width="60" height="36" rx="5" class="empty"/>
  <text x="700" y="182" class="mono" fill="#cf222e">2 compares</text>

  <!-- Row 2 -->
  <rect x="330" y="210" width="60" height="36" rx="5" class="scan"/>
  <rect x="400" y="210" width="60" height="36" rx="5" class="scan"/>
  <rect x="470" y="210" width="60" height="36" rx="5" class="scan"/><circle cx="500" cy="228" r="6" class="hit"/>
  <rect x="540" y="210" width="60" height="36" rx="5" class="empty"/>
  <rect x="610" y="210" width="60" height="36" rx="5" class="empty"/>
  <text x="700" y="232" class="mono" fill="#cf222e">3 compares</text>

  <!-- Row 3 -->
  <rect x="330" y="260" width="60" height="36" rx="5" class="scan"/>
  <rect x="400" y="260" width="60" height="36" rx="5" class="scan"/>
  <rect x="470" y="260" width="60" height="36" rx="5" class="scan"/>
  <rect x="540" y="260" width="60" height="36" rx="5" class="scan"/><circle cx="570" cy="278" r="6" class="hit"/>
  <rect x="610" y="260" width="60" height="36" rx="5" class="empty"/>
  <text x="700" y="282" class="mono" fill="#cf222e">4 compares</text>

  <!-- Row 4 -->
  <rect x="330" y="310" width="60" height="36" rx="5" class="scan"/>
  <rect x="400" y="310" width="60" height="36" rx="5" class="scan"/>
  <rect x="470" y="310" width="60" height="36" rx="5" class="scan"/>
  <rect x="540" y="310" width="60" height="36" rx="5" class="scan"/>
  <rect x="610" y="310" width="60" height="36" rx="5" class="scan"/><circle cx="640" cy="328" r="6" class="hit"/>
  <text x="700" y="332" class="mono" fill="#cf222e">5 compares</text>

  <!-- totals -->
  <text x="24" y="372" class="bad">Total = 1+2+3+4+5 = 15 = S(S+1)/2</text>
  <text x="24" y="396" class="muted mono" font-size="12.5">S = 5  &#8594; 15  &#183;  S = 100 &#8594; 5,050  &#183;  S = 1000 &#8594; 500,500   &#8212;  grows as S&#178;  (red filled = wasted comparisons)</text>
</svg>
