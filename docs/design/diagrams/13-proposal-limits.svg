<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .ttl{font-size:17px;font-weight:700;fill:#1f2328}
    .box{fill:#ffffff;stroke:#d0d7de;stroke-width:1.5}
    .hot{fill:#ffebe9;stroke:#cf222e;stroke-width:1.5}
    .cold{fill:#dafbe1;stroke:#1a7f37;stroke-width:1.5}
    .mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11.5px}
    .lbl{font-size:12.5px;fill:#1f2328}
    .muted{font-size:11px;fill:#656d76}
    .good{font-size:13px;font-weight:700;fill:#1a7f37}
    .bad{font-size:13px;font-weight:700;fill:#cf222e}
  </style>
  <rect x="0" y="0" width="900" height="420" fill="#f6f8fa"/>
  <text x="24" y="30" class="ttl">Proposal: durable position tracking for limits-based sourcing</text>

  <!-- BEFORE -->
  <text x="40" y="64" class="bad">TODAY &#8212; limits hub, on leader election / restart</text>
  <rect x="40" y="76" width="820" height="110" rx="10" class="hot" fill-opacity="0.3"/>
  <rect x="60" y="96" width="180" height="70" rx="8" class="box"/>
  <text x="150" y="124" text-anchor="middle" class="lbl" font-weight="700">HUB becomes leader</text>
  <text x="150" y="144" text-anchor="middle" class="muted">si.sseq lost in memory</text>
  <path d="M 240 131 H 300" stroke="#cf222e" stroke-width="1.8" marker-end="url(#r)"/>
  <rect x="304" y="96" width="270" height="70" rx="8" class="hot"/>
  <text x="439" y="120" text-anchor="middle" class="bad">REVERSE BLOCK SCAN</text>
  <text x="439" y="140" text-anchor="middle" class="muted">startingSequenceForSources</text>
  <text x="439" y="156" text-anchor="middle" class="muted">O(#blocks), holds mset.mu</text>
  <path d="M 574 131 H 634" stroke="#cf222e" stroke-width="1.8" marker-end="url(#r)"/>
  <rect x="638" y="96" width="200" height="70" rx="8" class="box"/>
  <text x="738" y="124" text-anchor="middle" class="lbl">recreate consumer</text>
  <text x="738" y="144" text-anchor="middle" class="muted">DeliverByStartSequence</text>

  <!-- AFTER -->
  <text x="40" y="234" class="good">PROPOSED &#8212; durable sourcing consumer also for limits (opt-in)</text>
  <rect x="40" y="246" width="820" height="130" rx="10" class="cold" fill-opacity="0.3"/>

  <rect x="60" y="268" width="200" height="88" rx="8" class="box"/>
  <text x="160" y="292" text-anchor="middle" class="lbl" font-weight="700">edge (origin)</text>
  <text x="160" y="312" text-anchor="middle" class="mono" fill="#0a3069">Durable JS_SRC_&lt;hash&gt;</text>
  <text x="160" y="330" text-anchor="middle" class="muted">AckFlowControl, no expiry</text>
  <text x="160" y="346" text-anchor="middle" class="muted">position persisted+replicated</text>

  <path d="M 260 312 H 320" stroke="#1a7f37" stroke-width="1.8" marker-end="url(#g)"/>
  <rect x="324" y="268" width="250" height="88" rx="8" class="cold"/>
  <text x="449" y="296" text-anchor="middle" class="good">HUB resumes from</text>
  <text x="449" y="316" text-anchor="middle" class="mono" fill="#0a3069">ConsumerInfo.Delivered/AckFloor</text>
  <text x="449" y="338" text-anchor="middle" class="muted">O(1) &#8212; block scan skipped</text>

  <path d="M 574 312 H 634" stroke="#1a7f37" stroke-width="1.8" marker-end="url(#g)"/>
  <rect x="638" y="268" width="200" height="88" rx="8" class="box"/>
  <text x="738" y="300" text-anchor="middle" class="lbl">re-bind &amp; continue</text>
  <text x="738" y="320" text-anchor="middle" class="muted">no message loss</text>
  <text x="738" y="338" text-anchor="middle" class="muted">(ack-gated flow control)</text>

  <text x="40" y="400" class="muted">Fallback path retained: if the origin is old (no API level 4) or the consumer is gone, fall back to the reverse scan. Cleanup needed when the source/hub is removed.</text>

  <defs>
    <marker id="r" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#cf222e"/></marker>
    <marker id="g" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#1a7f37"/></marker>
  </defs>
</svg>
