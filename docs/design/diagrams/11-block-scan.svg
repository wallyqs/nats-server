<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .ttl{font-size:17px;font-weight:700;fill:#1f2328}
    .blk{fill:#ffffff;stroke:#8c959f;stroke-width:1.4}
    .scan{fill:#ffe3df;stroke:#cf222e;stroke-width:1.6}
    .mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11px}
    .muted{font-size:11px;fill:#656d76}
    .lbl{font-size:12.5px;fill:#1f2328}
    .bad{font-size:13px;font-weight:700;fill:#cf222e}
    .s1{fill:#0969da} .s2{fill:#1a7f37} .s3{fill:#bf3989}
  </style>
  <rect x="0" y="0" width="900" height="440" fill="#f6f8fa"/>
  <text x="24" y="30" class="ttl">The reverse block scan: rebuild each source's last sequence from stored headers</text>
  <text x="24" y="52" class="muted">startingSequenceForSources walks back from LastSeq, LoadPrevMsgMulti loads (+decompresses) a block at a time until every source is found.</text>

  <!-- blocks B1..B8 left(old) to right(new) -->
  <!-- x from 40, each 100 wide -->
  <g>
    <!-- B1 -->
    <rect x="40" y="120" width="96" height="80" rx="6" class="blk"/><text x="88" y="214" text-anchor="middle" class="muted">B1</text>
    <rect x="144" y="120" width="96" height="80" rx="6" class="blk"/><text x="192" y="214" text-anchor="middle" class="muted">B2</text>
    <rect x="248" y="120" width="96" height="80" rx="6" class="scan"/><text x="296" y="214" text-anchor="middle" class="muted">B3</text>
    <rect x="352" y="120" width="96" height="80" rx="6" class="scan"/><text x="400" y="214" text-anchor="middle" class="muted">B4</text>
    <rect x="456" y="120" width="96" height="80" rx="6" class="scan"/><text x="504" y="214" text-anchor="middle" class="muted">B5</text>
    <rect x="560" y="120" width="96" height="80" rx="6" class="scan"/><text x="608" y="214" text-anchor="middle" class="muted">B6</text>
    <rect x="664" y="120" width="96" height="80" rx="6" class="scan"/><text x="712" y="214" text-anchor="middle" class="muted">B7</text>
    <rect x="768" y="120" width="96" height="80" rx="6" class="scan"/><text x="816" y="214" text-anchor="middle" class="muted">B8</text>
  </g>

  <!-- source contribution dots inside blocks: S1 (blue) frequent, S2 (green) frequent, S3 (pink) only in B3 -->
  <g>
    <!-- recent blocks lots of S1/S2 -->
    <circle cx="790" cy="140" r="5" class="s1"/><circle cx="810" cy="160" r="5" class="s2"/><circle cx="830" cy="180" r="5" class="s1"/>
    <circle cx="686" cy="140" r="5" class="s2"/><circle cx="706" cy="165" r="5" class="s1"/><circle cx="726" cy="185" r="5" class="s2"/>
    <circle cx="582" cy="145" r="5" class="s1"/><circle cx="602" cy="170" r="5" class="s2"/>
    <circle cx="478" cy="150" r="5" class="s2"/><circle cx="498" cy="175" r="5" class="s1"/>
    <circle cx="374" cy="150" r="5" class="s1"/><circle cx="394" cy="178" r="5" class="s2"/>
    <!-- S3 last contribution way back in B3 -->
    <circle cx="296" cy="160" r="7" class="s3"/>
  </g>

  <!-- LastSeq pointer at right -->
  <path d="M 864 100 V 118" stroke="#1f2328" stroke-width="1.5" marker-end="url(#d)"/>
  <text x="864" y="94" text-anchor="middle" class="mono" fill="#1f2328">LastSeq</text>

  <!-- scan direction arrow -->
  <path d="M 850 240 H 285" stroke="#cf222e" stroke-width="2.2" marker-end="url(#r)"/>
  <text x="560" y="262" text-anchor="middle" class="bad">scan direction (newest &#8594; oldest), one block load per step</text>

  <!-- found markers -->
  <text x="816" y="300" text-anchor="middle" class="mono s1">S1 found</text>
  <text x="712" y="300" text-anchor="middle" class="mono s2">S2 found</text>
  <text x="296" y="300" text-anchor="middle" class="mono s3">S3 found (quiet source)</text>
  <path d="M 296 285 V 205" stroke="#bf3989" stroke-width="1.3" stroke-dasharray="3 3"/>

  <!-- legend -->
  <g class="lbl">
    <circle cx="46" cy="330" r="5" class="s1"/><text x="58" y="334">S1 (active)</text>
    <circle cx="160" cy="330" r="5" class="s2"/><text x="172" y="334">S2 (active)</text>
    <circle cx="280" cy="330" r="5" class="s3"/><text x="292" y="334">S3 (quiet &#8212; forces the scan all the way back to B3)</text>
  </g>

  <rect x="40" y="352" width="824" height="64" rx="9" fill="#ffebe9" stroke="#cf222e" stroke-width="1.3"/>
  <text x="56" y="374" class="bad">Why it can be slow on a limits-based stream</text>
  <text x="56" y="392" class="muted">A single quiet/sparse source (S3) forces the scan past every newer block &#8212; worst case the entire stream. Each uncached block is read</text>
  <text x="56" y="408" class="muted">from disk, decrypted and decompressed. With many sources and a large store, leader election stalls under mset.mu while this runs.</text>

  <defs>
    <marker id="r" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#cf222e"/></marker>
    <marker id="d" markerWidth="8" markerHeight="8" refX="4" refY="6" orient="auto"><path d="M0,0 L8,0 L4,7 Z" fill="#1f2328"/></marker>
  </defs>
</svg>
