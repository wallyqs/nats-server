<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .ttl{font-size:17px;font-weight:700;fill:#1f2328}
    .hub{fill:#ddf4ff;stroke:#0969da;stroke-width:2}
    .edge{fill:#fff8c5;stroke:#9a6700;stroke-width:1.8}
    .stream{fill:#ffffff;stroke:#d0d7de;stroke-width:1.4}
    .mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11px}
    .lbl{font-size:13px;fill:#1f2328}
    .muted{font-size:11px;fill:#656d76}
    .bad{font-size:12px;font-weight:700;fill:#cf222e}
  </style>
  <rect x="0" y="0" width="900" height="470" fill="#f6f8fa"/>
  <text x="24" y="32" class="ttl">Motivating case: HUB sources from N edge leafnode streams across JS domains</text>

  <!-- HUB -->
  <rect x="300" y="56" width="300" height="120" rx="12" class="hub"/>
  <text x="450" y="82" text-anchor="middle" class="lbl" font-weight="700">HUB cluster</text>
  <rect x="324" y="96" width="252" height="64" rx="8" class="stream"/>
  <text x="340" y="118" class="mono" fill="#0550ae">stream "AGG"  (sources: edge-1..edge-N)</text>
  <text x="340" y="138" class="muted">N external sources, one per edge site</text>
  <text x="340" y="154" class="bad">setup O(N&#178;) &#183; INFO O(N&#178;) &#183; update O(N&#178;)</text>

  <!-- edges -->
  <g>
    <rect x="40" y="300" width="220" height="130" rx="10" class="edge"/>
    <text x="150" y="324" text-anchor="middle" class="lbl" font-weight="700">edge-1 (leafnode)</text>
    <text x="150" y="342" text-anchor="middle" class="muted">JS domain: "edge1"</text>
    <rect x="60" y="352" width="180" height="58" rx="7" class="stream"/>
    <text x="74" y="374" class="mono" fill="#0550ae">stream "ORDERS"</text>
    <text x="74" y="394" class="muted">$JS.edge1.API.&#8230;</text>

    <rect x="340" y="300" width="220" height="130" rx="10" class="edge"/>
    <text x="450" y="324" text-anchor="middle" class="lbl" font-weight="700">edge-2 (leafnode)</text>
    <text x="450" y="342" text-anchor="middle" class="muted">JS domain: "edge2"</text>
    <rect x="360" y="352" width="180" height="58" rx="7" class="stream"/>
    <text x="374" y="374" class="mono" fill="#0550ae">stream "ORDERS"</text>
    <text x="374" y="394" class="muted">$JS.edge2.API.&#8230;</text>

    <rect x="640" y="300" width="220" height="130" rx="10" class="edge"/>
    <text x="750" y="324" text-anchor="middle" class="lbl" font-weight="700">edge-N (leafnode)</text>
    <text x="750" y="342" text-anchor="middle" class="muted">JS domain: "edgeN"</text>
    <rect x="660" y="352" width="180" height="58" rx="7" class="stream"/>
    <text x="674" y="374" class="mono" fill="#0550ae">stream "ORDERS"</text>
    <text x="674" y="394" class="muted">$JS.edgeN.API.&#8230;</text>
  </g>

  <!-- leaf links -->
  <path d="M 360 176 C 300 240, 200 250, 150 296" stroke="#0969da" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
  <path d="M 450 176 L 450 296" stroke="#0969da" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
  <path d="M 540 176 C 600 240, 700 250, 750 296" stroke="#0969da" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
  <text x="612" y="232" class="muted" fill="#0969da">one external source consumer per edge (ApiPrefix rewrite)</text>

  <!-- callout -->
  <rect x="40" y="196" width="520" height="80" rx="9" fill="#ffebe9" stroke="#cf222e" stroke-width="1.4"/>
  <text x="56" y="218" class="bad">All sources are External &#8594; every setup/INFO call resolves iname &#8594; *StreamSource</text>
  <text x="56" y="236" class="muted">via the O(N) streamSource() walk, once per source &#8594; O(N&#178;). Each external resolve also</text>
  <text x="56" y="252" class="muted">recomputes getHash(ApiPrefix) for the iname/cname/INFO. iname disambiguates the shared</text>
  <text x="56" y="268" class="muted">name "ORDERS" by domain: "ORDERS:&lt;hash(edgeK)&gt; &gt; &gt;".</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#0969da"/></marker>
  </defs>
</svg>
