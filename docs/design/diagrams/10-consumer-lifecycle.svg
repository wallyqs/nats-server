<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .ttl{font-size:17px;font-weight:700;fill:#1f2328}
    .box{fill:#ffffff;stroke:#d0d7de;stroke-width:1.5}
    .trig{fill:#fff8c5;stroke:#9a6700;stroke-width:1.5}
    .cold{fill:#dafbe1;stroke:#1a7f37;stroke-width:1.5}
    .hot{fill:#ffebe9;stroke:#cf222e;stroke-width:1.5}
    .mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11.5px}
    .lbl{font-size:13px;fill:#1f2328}
    .muted{font-size:11px;fill:#656d76}
    .good{font-size:13px;font-weight:700;fill:#1a7f37}
    .bad{font-size:13px;font-weight:700;fill:#cf222e}
  </style>
  <rect x="0" y="0" width="900" height="470" fill="#f6f8fa"/>
  <text x="24" y="32" class="ttl">Source-consumer (re)creation triggers &#8212; which ones pay the block scan</text>

  <!-- triggers -->
  <text x="40" y="72" class="muted">TRIGGER</text>
  <rect x="40" y="80" width="250" height="58" rx="8" class="trig"/>
  <text x="56" y="104" class="lbl" font-weight="700">Leafnode reconnect / stall</text>
  <text x="56" y="124" class="mono" fill="#633c01">retryDisconnectedSyncConsumers</text>

  <rect x="40" y="200" width="250" height="58" rx="8" class="trig"/>
  <text x="56" y="224" class="lbl" font-weight="700">HUB stream leader election</text>
  <text x="56" y="244" class="lbl" font-weight="700">/ restart</text>

  <rect x="40" y="320" width="250" height="58" rx="8" class="trig"/>
  <text x="56" y="344" class="lbl" font-weight="700">Source added (UPDATE)</text>
  <text x="56" y="364" class="mono" fill="#633c01">setStartingSequenceForSources</text>

  <!-- middle handlers -->
  <text x="360" y="72" class="muted">HANDLER</text>
  <rect x="360" y="80" width="230" height="58" rx="8" class="box"/>
  <text x="376" y="104" class="mono" fill="#0550ae">setupSourceConsumer(</text>
  <text x="376" y="122" class="mono" fill="#0550ae">  iname, si.sseq+1)</text>

  <rect x="360" y="200" width="230" height="58" rx="8" class="box"/>
  <text x="376" y="224" class="mono" fill="#0550ae">setupSourceConsumers()</text>
  <text x="376" y="244" class="mono" fill="#0550ae">  &#8594; startingSequenceForSources</text>

  <rect x="360" y="320" width="230" height="58" rx="8" class="box"/>
  <text x="376" y="344" class="mono" fill="#0550ae">scan only the NEW sources'</text>
  <text x="376" y="364" class="mono" fill="#0550ae">starting seqs</text>

  <!-- resume mode -->
  <text x="650" y="72" class="muted">RESUME COST</text>
  <rect x="650" y="80" width="210" height="58" rx="8" class="cold"/>
  <text x="755" y="104" text-anchor="middle" class="good">in-memory si.sseq</text>
  <text x="755" y="124" text-anchor="middle" class="muted">O(1) &#8212; no store read</text>

  <rect x="650" y="190" width="210" height="78" rx="8" class="hot"/>
  <text x="755" y="214" text-anchor="middle" class="bad">REVERSE BLOCK SCAN</text>
  <text x="755" y="234" text-anchor="middle" class="muted">si.sseq is gone in memory;</text>
  <text x="755" y="250" text-anchor="middle" class="muted">rebuild from stored headers</text>
  <text x="755" y="264" text-anchor="middle" class="muted">then max(Delivered.Stream)</text>

  <rect x="650" y="320" width="210" height="58" rx="8" class="hot"/>
  <text x="755" y="344" text-anchor="middle" class="bad">partial block scan</text>
  <text x="755" y="364" text-anchor="middle" class="muted">for the added sources</text>

  <!-- arrows -->
  <g stroke-width="1.8" fill="none">
    <path d="M 290 109 H 356" stroke="#1a7f37" marker-end="url(#g)"/>
    <path d="M 590 109 H 646" stroke="#1a7f37" marker-end="url(#g)"/>
    <path d="M 290 229 H 356" stroke="#cf222e" marker-end="url(#r)"/>
    <path d="M 590 229 H 646" stroke="#cf222e" marker-end="url(#r)"/>
    <path d="M 290 349 H 356" stroke="#cf222e" marker-end="url(#r)"/>
    <path d="M 590 349 H 646" stroke="#cf222e" marker-end="url(#r)"/>
  </g>

  <text x="40" y="430" class="muted">Key: a plain leafnode reconnect resumes from memory and is cheap. The block scan is paid on HUB leader election / restart, when</text>
  <text x="40" y="448" class="muted">the in-memory per-source sequence has been lost and must be reconstructed from the stream's own stored Nats-Stream-Source headers.</text>

  <defs>
    <marker id="g" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#1a7f37"/></marker>
    <marker id="r" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#cf222e"/></marker>
  </defs>
</svg>
